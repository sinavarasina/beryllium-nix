# Landscape 2246x1080 on beryllium (Adreno 630 / msm). Catppuccin Mocha palette.
################### Layout ###################
legacy_layout=false
horizontal
horizontal_stretch=false
hud_compact
no_small_font
table_columns=4

################### Position & look ###################
position=bottom-left
toggle_hud=Shift_R+F12
reload_cfg=Shift_L+F4
offset_x=20
offset_y=0

background_alpha=0.0
background_color=1E1E2E
round_corners=0

text_outline=1
text_outline_color=11111B
text_outline_thickness=1.5

font_size=20
font_size_text=20
font_size_secondary=16

text_color=CDD6F4
alpha=1.0

################### FPS / frame ###################
fps
fps_metrics=avg,0.01
fps_sampling_period=500
fps_color_change
fps_color=F38BA8,F9E2AF,A6E3A1
fps_value=30,60
frametime=1
frame_timing=0
frametime_color=A6E3A1

################### GPU (msm) ###################
gpu_text=GPU
gpu_stats
gpu_load_change
gpu_load_value=50,90
gpu_load_color=CDD6F4,FAB387,F38BA8
gpu_temp
gpu_core_clock  # drop if it always reads 0
gpu_color=A6E3A1
# gpu_power gpu_name gpu_fan gpu_junction_temp gpu_mem_clock: not exposed by msm

################### CPU ###################
cpu_text=CPU
cpu_stats
cpu_load_change
cpu_load_value=50,90
cpu_load_color=CDD6F4,FAB387,F38BA8
cpu_mhz
cpu_temp        # drop if it always reads 0 on this SoC
cpu_color=74C7EC
# cpu_power is RAPL (x86 only)

################### Memory ###################
vram
vram_color=CBA6F7
ram
ram_color=F5C2E7
procmem

################### Runtime ###################
present_mode
wine
wine_color=FAB387

################### System / battery ###################
custom_text=Kernel
exec=uname -r
battery
battery_color=A6E3A1
battery_watt
battery_time
device_battery=gamepad
device_battery_icon

################### Logging ###################
output_folder=/home/sina
log_duration=30
autostart_log=0
log_interval=100
toggle_logging=Shift_L+F2
